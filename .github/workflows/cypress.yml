name: cypress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run main suite
        id: main
        shell: bash
        run: |
          mkdir -p reports
          npm test 2>&1 | tee reports/main-run.log

      - name: Run accessibility audit
        id: accessibility
        if: ${{ !cancelled() && steps.main.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: npm run test:a11y 2>&1 | tee reports/accessibility-run.log

      - name: Compare accessibility results with known defects
        if: ${{ !cancelled() && steps.accessibility.outcome != 'skipped' }}
        run: npm run test:a11y:baseline

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-evidence
          path: |
            reports/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 14
