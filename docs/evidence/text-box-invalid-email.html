<form id="userForm" class="">
  <div id="userName-wrapper" class="mt-2 row">
    <div class="col-md-3 col-sm-12">
      <label class="form-label" id="userName-label">Full Name</label>
    </div>
    <div class="col-md-9 col-sm-12">
      <input
        autocomplete="off"
        placeholder="Full Name"
        id="userName"
        class="mr-sm-2 form-control"
        type="text"
      />
    </div>
  </div>
  <div id="userEmail-wrapper" class="mt-2 row">
    <div class="col-md-3 col-sm-12">
      <label class="form-label" id="userEmail-label">Email</label>
    </div>
    <div class="col-md-9 col-sm-12">
      <input
        autocomplete="off"
        placeholder="name@example.com"
        id="userEmail"
        class="mr-sm-2 field-error form-control"
        type="email"
      />
    </div>
  </div>
  <div id="currentAddress-wrapper" class="mt-2 row">
    <div class="col-md-3 col-sm-12">
      <label class="form-label" id="currentAddress-label"
        >Current Address</label
      >
    </div>
    <div class="col-md-9 col-sm-12">
      <textarea
        placeholder="Current Address"
        rows="5"
        cols="20"
        id="currentAddress"
        class="form-control"
      ></textarea>
    </div>
  </div>
  <div id="permanentAddress-wrapper" class="mt-2 row">
    <div class="col-md-3 col-sm-12">
      <label class="form-label" id="permanentAddress-label"
        >Permanent Address</label
      >
    </div>
    <div class="col-md-9 col-sm-12">
      <textarea
        rows="5"
        cols="20"
        id="permanentAddress"
        class="form-control"
      ></textarea>
    </div>
  </div>
  <div class="mt-2 justify-content-end row">
    <div class="text-right col-md-2 col-sm-12">
      <button type="button" id="submit" class="btn btn-primary">Submit</button>
    </div>
  </div>
  <div id="output" class="mt-4 row">
    <div class="undefined col-md-12 col-sm-12"></div>
  </div>
</form>
